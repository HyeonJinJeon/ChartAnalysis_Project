server:
  port: 8080

spring:
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/FREEPDB1
    username: chartuser
    password: chartpass
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.OracleDialect

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: chart-analysis-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.chartanalysis.kafka"

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

jwt:
  secret: chartAnalysisSecretKeyForJwtTokenGenerationMustBe256BitsLong
  expiration: 86400000

stock:
  seed-money: 1000000

finnhub:
  api-key: d84qfqpr01qutij9qhagd84qfqpr01qutij9qhb0
  us-symbols: AAPL,TSLA,NVDA,MSFT,AMZN,GOOGL,META

yahoo:
